# Synthetic RF topology for net-sim
#
# 5 "towns" (Aberdeen, Bristol, Cambridge, Durham, Exeter) each on their own
# afsk1200 town channel. 5 dedicated point-to-point backbone links (gfsk9600,
# one il2p) interconnect "HUB" nodes between towns. Aberdeen also has one
# spare port exposed to the host so a real packet node can join the network
# on the Aberdeen town channel.
#
# Each net-sim "node" models one radio station; its "ports" are its radios.
# Town members share a channel — linked mutually with realistic intra-town
# losses (and one hidden-node pair per larger town). Backbone links are just
# two ports linked to each other.
#
# KISS TCP port plan (all inside the netsim container):
#   8001-8004  Aberdeen   town (QA0ABN/ABS/BBS/HUB)
#   8005-8007  Bristol    town (QB0BRI/BBS/HUB)
#   8008-8010  Cambridge  town (QC0CAM/CAS/HUB)
#   8011-8014  Durham     town (QD0DUR/DUS/CHT/HUB)
#   8015-8018  Exeter     town (QE0EXE/EXS/BBS/HUB)
#   8021/8022  Backbone   ABE <-> DUR  (gfsk9600)
#   8023/8024  Backbone   DUR <-> CAM  (gfsk9600)
#   8025/8026  Backbone   CAM <-> BRI  (gfsk9600)
#   8027/8028  Backbone   BRI <-> EXE  (gfsk9600)
#   8029/8030  Backbone   DUR <-> BRI  (il2p over gfsk9600 — strong FEC)
#   8100       External   user attach (joins Aberdeen town channel)

mixer_mode: fm_capture
capture_db: 6.0
collision_mode: silence

nodes:
  # ---------- Aberdeen town (QA*) ----------
  - id: QA0ABN
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8001 }
  - id: QA0ABS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8002 }
  - id: QA0BBS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8003 }
  - id: QA0HUB
    ports:
      - { id: vhf,    modem: { mode: afsk1200 }, kiss_port: 8004 }
      - { id: to_dur, modem: { mode: gfsk9600 }, kiss_port: 8021 }

  # ---------- Bristol town (QB*) ----------
  - id: QB0BRI
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8005 }
  - id: QB0BBS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8006 }
  - id: QB0HUB
    ports:
      - { id: vhf,    modem: { mode: afsk1200 }, kiss_port: 8007 }
      - { id: to_cam, modem: { mode: gfsk9600 }, kiss_port: 8026 }
      - { id: to_exe, modem: { mode: gfsk9600 }, kiss_port: 8027 }
      - { id: to_dur, modem: { mode: il2p, inner: gfsk9600, fec: strong }, kiss_port: 8030 }

  # ---------- Cambridge town (QC*) ----------
  - id: QC0CAM
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8008 }
  - id: QC0CAS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8009 }
  - id: QC0HUB
    ports:
      - { id: vhf,    modem: { mode: afsk1200 }, kiss_port: 8010 }
      - { id: to_dur, modem: { mode: gfsk9600 }, kiss_port: 8024 }
      - { id: to_bri, modem: { mode: gfsk9600 }, kiss_port: 8025 }

  # ---------- Durham town (QD*) ----------
  - id: QD0DUR
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8011 }
  - id: QD0DUS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8012 }
  - id: QD0CHT
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8013 }
  - id: QD0HUB
    ports:
      - { id: vhf,    modem: { mode: afsk1200 }, kiss_port: 8014 }
      - { id: to_abe, modem: { mode: gfsk9600 }, kiss_port: 8022 }
      - { id: to_cam, modem: { mode: gfsk9600 }, kiss_port: 8023 }
      - { id: to_bri, modem: { mode: il2p, inner: gfsk9600, fec: strong }, kiss_port: 8029 }

  # ---------- Exeter town (QE*) ----------
  - id: QE0EXE
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8015 }
  - id: QE0EXS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8016 }
  - id: QE0BBS
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8017 }
  - id: QE0HUB
    ports:
      - { id: vhf,    modem: { mode: afsk1200 }, kiss_port: 8018 }
      - { id: to_bri, modem: { mode: gfsk9600 }, kiss_port: 8028 }

  # ---------- External attach point for your real packet node ----------
  # Sits on the Aberdeen town channel. KISS port 8100 is published to the host.
  - id: USEREXT
    ports:
      - { id: vhf, modem: { mode: afsk1200 }, kiss_port: 8100 }

links:
  # ====================================================================
  # Aberdeen town channel — full 5-way mesh.
  # QA0ABN <-> QA0ABS are a hidden-node pair (35 dB between them) but both
  # are heard cleanly by QA0HUB and QA0BBS. USEREXT can also reach all.
  # ====================================================================
  - { from: QA0ABN.vhf, to: QA0HUB.vhf,    loss_db: 5  }
  - { from: QA0HUB.vhf, to: QA0ABN.vhf,    loss_db: 5  }
  - { from: QA0ABS.vhf, to: QA0HUB.vhf,    loss_db: 5  }
  - { from: QA0HUB.vhf, to: QA0ABS.vhf,    loss_db: 5  }
  - { from: QA0BBS.vhf, to: QA0HUB.vhf,    loss_db: 3  }
  - { from: QA0HUB.vhf, to: QA0BBS.vhf,    loss_db: 3  }
  - { from: QA0ABN.vhf, to: QA0BBS.vhf,    loss_db: 8  }
  - { from: QA0BBS.vhf, to: QA0ABN.vhf,    loss_db: 8  }
  - { from: QA0ABS.vhf, to: QA0BBS.vhf,    loss_db: 8  }
  - { from: QA0BBS.vhf, to: QA0ABS.vhf,    loss_db: 8  }
  - { from: QA0ABN.vhf, to: QA0ABS.vhf,    loss_db: 35 }  # hidden pair
  - { from: QA0ABS.vhf, to: QA0ABN.vhf,    loss_db: 35 }  # hidden pair
  - { from: USEREXT.vhf, to: QA0HUB.vhf,   loss_db: 5  }
  - { from: QA0HUB.vhf,  to: USEREXT.vhf,  loss_db: 5  }
  - { from: USEREXT.vhf, to: QA0BBS.vhf,   loss_db: 10 }
  - { from: QA0BBS.vhf,  to: USEREXT.vhf,  loss_db: 10 }
  - { from: USEREXT.vhf, to: QA0ABN.vhf,   loss_db: 10 }
  - { from: QA0ABN.vhf,  to: USEREXT.vhf,  loss_db: 10 }
  - { from: USEREXT.vhf, to: QA0ABS.vhf,   loss_db: 10 }
  - { from: QA0ABS.vhf,  to: USEREXT.vhf,  loss_db: 10 }

  # ====================================================================
  # Bristol town channel — simple 3-way mesh, all hear each other well.
  # ====================================================================
  - { from: QB0BRI.vhf, to: QB0HUB.vhf, loss_db: 5 }
  - { from: QB0HUB.vhf, to: QB0BRI.vhf, loss_db: 5 }
  - { from: QB0BBS.vhf, to: QB0HUB.vhf, loss_db: 5 }
  - { from: QB0HUB.vhf, to: QB0BBS.vhf, loss_db: 5 }
  - { from: QB0BRI.vhf, to: QB0BBS.vhf, loss_db: 8 }
  - { from: QB0BBS.vhf, to: QB0BRI.vhf, loss_db: 8 }

  # ====================================================================
  # Cambridge town channel — QC0CAM and QC0CAS partially overlap (25 dB),
  # both fully heard by the hub.
  # ====================================================================
  - { from: QC0CAM.vhf, to: QC0HUB.vhf, loss_db: 5  }
  - { from: QC0HUB.vhf, to: QC0CAM.vhf, loss_db: 5  }
  - { from: QC0CAS.vhf, to: QC0HUB.vhf, loss_db: 8  }
  - { from: QC0HUB.vhf, to: QC0CAS.vhf, loss_db: 8  }
  - { from: QC0CAM.vhf, to: QC0CAS.vhf, loss_db: 25 }
  - { from: QC0CAS.vhf, to: QC0CAM.vhf, loss_db: 25 }

  # ====================================================================
  # Durham town channel — QD0DUR <-> QD0DUS are hidden (30 dB). Chat node
  # is reachable to everyone in town.
  # ====================================================================
  - { from: QD0DUR.vhf, to: QD0HUB.vhf, loss_db: 5  }
  - { from: QD0HUB.vhf, to: QD0DUR.vhf, loss_db: 5  }
  - { from: QD0DUS.vhf, to: QD0HUB.vhf, loss_db: 8  }
  - { from: QD0HUB.vhf, to: QD0DUS.vhf, loss_db: 8  }
  - { from: QD0CHT.vhf, to: QD0HUB.vhf, loss_db: 3  }
  - { from: QD0HUB.vhf, to: QD0CHT.vhf, loss_db: 3  }
  - { from: QD0DUR.vhf, to: QD0CHT.vhf, loss_db: 8  }
  - { from: QD0CHT.vhf, to: QD0DUR.vhf, loss_db: 8  }
  - { from: QD0DUS.vhf, to: QD0CHT.vhf, loss_db: 12 }
  - { from: QD0CHT.vhf, to: QD0DUS.vhf, loss_db: 12 }
  - { from: QD0DUR.vhf, to: QD0DUS.vhf, loss_db: 30 }  # hidden pair
  - { from: QD0DUS.vhf, to: QD0DUR.vhf, loss_db: 30 }

  # ====================================================================
  # Exeter town channel — full mesh, with a moderate-loss pair (EXE/EXS).
  # ====================================================================
  - { from: QE0EXE.vhf, to: QE0HUB.vhf, loss_db: 5  }
  - { from: QE0HUB.vhf, to: QE0EXE.vhf, loss_db: 5  }
  - { from: QE0EXS.vhf, to: QE0HUB.vhf, loss_db: 5  }
  - { from: QE0HUB.vhf, to: QE0EXS.vhf, loss_db: 5  }
  - { from: QE0BBS.vhf, to: QE0HUB.vhf, loss_db: 3  }
  - { from: QE0HUB.vhf, to: QE0BBS.vhf, loss_db: 3  }
  - { from: QE0EXE.vhf, to: QE0EXS.vhf, loss_db: 20 }
  - { from: QE0EXS.vhf, to: QE0EXE.vhf, loss_db: 20 }
  - { from: QE0EXE.vhf, to: QE0BBS.vhf, loss_db: 8  }
  - { from: QE0BBS.vhf, to: QE0EXE.vhf, loss_db: 8  }
  - { from: QE0EXS.vhf, to: QE0BBS.vhf, loss_db: 10 }
  - { from: QE0BBS.vhf, to: QE0EXS.vhf, loss_db: 10 }

  # ====================================================================
  # Backbone point-to-point links — just the two HUB ends.
  # ====================================================================
  # ABE <-> DUR
  - { from: QA0HUB.to_dur, to: QD0HUB.to_abe, loss_db: 2 }
  - { from: QD0HUB.to_abe, to: QA0HUB.to_dur, loss_db: 2 }
  # DUR <-> CAM
  - { from: QD0HUB.to_cam, to: QC0HUB.to_dur, loss_db: 2 }
  - { from: QC0HUB.to_dur, to: QD0HUB.to_cam, loss_db: 2 }
  # CAM <-> BRI
  - { from: QC0HUB.to_bri, to: QB0HUB.to_cam, loss_db: 2 }
  - { from: QB0HUB.to_cam, to: QC0HUB.to_bri, loss_db: 2 }
  # BRI <-> EXE
  - { from: QB0HUB.to_exe, to: QE0HUB.to_bri, loss_db: 2 }
  - { from: QE0HUB.to_bri, to: QB0HUB.to_exe, loss_db: 2 }
  # DUR <-> BRI (il2p diagonal — slightly higher loss)
  - { from: QD0HUB.to_bri, to: QB0HUB.to_dur, loss_db: 4 }
  - { from: QB0HUB.to_dur, to: QD0HUB.to_bri, loss_db: 4 }
