# XRouter node QA0XRT-1 — Aberdeen XRouter, on the Aberdeen 2m channel.
# Speaks NETROM with the BPQ stations on that channel; users telnetting
# in can `C QD0HUB-2` to reach the Durham hub's chat across the network.

# Static-linked binary — must specify DNS for any hostname lookups.
DNS=8.8.8.8

# --- Identity ---
NODECALL=QA0XRT-1
NODEALIAS=ABEXRT
CONSOLECALL=QA0XRT
LOCATOR=IO87IM
QTH=Aberdeen, synthetic test net

# We intentionally do NOT define CHATCALL/CHATALIAS here — the only
# chat in the test net lives at BPQ's QD0HUB-2 (`CHT`); a second
# XRouter-hosted chat at the same site would be confusing.

CTEXT
QA0XRT-1 (ABEXRT) XRouter on the test net.
Aberdeen 2m channel. Try:  C CHT   (or  C QD0HUB-2  for direct).
Type ? for command list.
***

INFOTEXT
QA0XRT-1 — synthetic test-net XRouter, Aberdeen channel.
Talks NETROM with QA0HUB-7, QA0ABN-7, QA0ABS-7, USEREXT (real packet
node attach point). Routes onward to the rest of the network via
the Durham/Bristol/Cambridge/Exeter backbones at QA0HUB.
***

IDTEXT
QA0XRT-1 ABEXRT XRouter test
***

# --- Interface to netsim's Aberdeen-channel KISS port ---
INTERFACE=1
	ID=NETSIM
	TYPE=TCP
	PROTOCOL=KISS
	MTU=256
	IOADDR=172.28.0.10
	INTNUM=8019
ENDINTERFACE

# --- Port bound to that interface ---
PORT=1
	ID=ABE2M
	INTERFACENUM=1
	CHANNEL=A
	QUALITY=192
	MAXFRAME=4
	PACLEN=120
	FRACK=3000
	RESPTIME=1000
	RETRIES=10
	MHEARD=25
ENDPORT

# --- User-facing services (host-published in docker-compose) ---
TELNETPORT=23 23
HTTPPORT=80 80
TELPROXYPORT=2323 2323

# Don't run the other tcp daemons we won't use.
FTPPORT=0
FINGERPORT=0
TTYLINKPORT=0
RLOGINPORT=0
SOCKSPORT=0
APRSPORT=0
MQTTPORT=0
AGWPORT=0
RHPPORT=0

# --- NetROM / routing ---
# Permissive MINQUAL so the small synthetic net populates quickly,
# matching the BPQ-side setting.
MINQUAL=10
