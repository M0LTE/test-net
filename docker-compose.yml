# Synthetic "RF" test network: one net-sim container + 14 linbpq containers.
#
# Bring up:    docker compose up -d
# Tear down:   docker compose down
# Logs:        docker compose logs -f <service>     e.g. QD0HUB
#
# Web UIs on host ports 18001-18018 (HTTP) and 18101-18118 (telnet console).
# net-sim topology UI on http://localhost:8080
# Real-node attach point:  KISS over TCP to localhost:8100  (Aberdeen channel)

x-linbpq: &linbpq
  image: m0lte/linbpq:latest
  restart: unless-stopped
  depends_on:
    netsim:
      condition: service_healthy
  networks: [rfnet]

services:
  # ------------------------------------------------------------------
  # net-sim: simulates the RF channels and inter-port path loss.
  # ------------------------------------------------------------------
  netsim:
    image: ghcr.io/packethacking/net-sim:main
    container_name: netsim
    restart: unless-stopped
    volumes:
      - ./netsim/network.yaml:/etc/sim/network.yaml:ro
      # Read-only Docker socket — lets the visualiser's /api/stats
      # endpoint aggregate CPU% across this sim's containers. Not
      # required for the simulation itself; remove if you'd rather
      # not expose the daemon socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The netsim image runs as the unprivileged `sim` user (uid 999).
    # Docker daemon's socket is typically root:docker (660); to read it
    # without running as root, the container needs to belong to that
    # GID. Override at runtime if your host's docker group GID is
    # different:    DOCKER_SOCK_GID=998 docker compose up -d
    group_add:
      - "${DOCKER_SOCK_GID:-1001}"
    ports:
      - "8080:8080"      # net-sim web UI
      - "8100:8100"      # external attach KISS (Aberdeen channel)
    # linbpq's IPADDR= does not resolve hostnames; pin a known IP here.
    networks:
      rfnet:
        ipv4_address: 172.28.0.10
    healthcheck:
      # netsim image has neither wget nor curl; use bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ------------------------------------------------------------------
  # Aberdeen (QA*) — town channel: netsim ports 8001-8004
  # ------------------------------------------------------------------
  QA0ABN:
    <<: *linbpq
    container_name: QA0ABN
    volumes: [ "./nodes/QA0ABN:/data" ]
    ports: [ "18001:8008", "18101:8010", "18201:8011" ]

  QA0ABS:
    <<: *linbpq
    container_name: QA0ABS
    volumes: [ "./nodes/QA0ABS:/data" ]
    # 18002: HTTP UI · 18102: BPQ telnet console · 18202: FBB (QtTermTCP)
    ports: [ "18002:8008", "18102:8010", "18202:8011" ]


  QA0HUB:
    <<: *linbpq
    container_name: QA0HUB
    volumes: [ "./nodes/QA0HUB:/data" ]
    ports: [ "18004:8008", "18104:8010", "18204:8011" ]
    command: ["mail"]

  # ------------------------------------------------------------------
  # Bristol (QB*) — town channel: netsim ports 8005-8007
  # ------------------------------------------------------------------
  QB0BRI:
    <<: *linbpq
    container_name: QB0BRI
    volumes: [ "./nodes/QB0BRI:/data" ]
    ports: [ "18005:8008", "18105:8010", "18205:8011" ]


  QB0HUB:
    <<: *linbpq
    container_name: QB0HUB
    volumes: [ "./nodes/QB0HUB:/data" ]
    ports: [ "18007:8008", "18107:8010", "18207:8011" ]
    command: ["mail"]

  # ------------------------------------------------------------------
  # Cambridge (QC*) — town channel: netsim ports 8008-8010
  # ------------------------------------------------------------------
  QC0CAM:
    <<: *linbpq
    container_name: QC0CAM
    volumes: [ "./nodes/QC0CAM:/data" ]
    ports: [ "18008:8008", "18108:8010", "18208:8011" ]

  QC0CAS:
    <<: *linbpq
    container_name: QC0CAS
    volumes: [ "./nodes/QC0CAS:/data" ]
    ports: [ "18009:8008", "18109:8010", "18209:8011" ]

  QC0HUB:
    <<: *linbpq
    container_name: QC0HUB
    volumes: [ "./nodes/QC0HUB:/data" ]
    ports: [ "18010:8008", "18110:8010", "18210:8011" ]

  # ------------------------------------------------------------------
  # Durham (QD*) — town channel: netsim ports 8011-8014
  # ------------------------------------------------------------------
  QD0DUR:
    <<: *linbpq
    container_name: QD0DUR
    volumes: [ "./nodes/QD0DUR:/data" ]
    ports: [ "18011:8008", "18111:8010", "18211:8011" ]

  QD0DUS:
    <<: *linbpq
    container_name: QD0DUS
    volumes: [ "./nodes/QD0DUS:/data" ]
    ports: [ "18012:8008", "18112:8010", "18212:8011" ]


  QD0HUB:
    <<: *linbpq
    container_name: QD0HUB
    volumes: [ "./nodes/QD0HUB:/data" ]
    # 18014: HTTP UI · 18114: BPQ telnet console · 18214: FBB (QtTermTCP)
    ports: [ "18014:8008", "18114:8010", "18214:8011" ]
    command: ["chat"]

  # ------------------------------------------------------------------
  # Exeter (QE*) — town channel: netsim ports 8015-8018
  # ------------------------------------------------------------------
  QE0EXE:
    <<: *linbpq
    container_name: QE0EXE
    volumes: [ "./nodes/QE0EXE:/data" ]
    ports: [ "18015:8008", "18115:8010", "18215:8011" ]

  QE0EXS:
    <<: *linbpq
    container_name: QE0EXS
    volumes: [ "./nodes/QE0EXS:/data" ]
    ports: [ "18016:8008", "18116:8010", "18216:8011" ]


  QE0HUB:
    <<: *linbpq
    container_name: QE0HUB
    volumes: [ "./nodes/QE0HUB:/data" ]
    ports: [ "18018:8008", "18118:8010", "18218:8011" ]
    command: ["mail"]

  # ------------------------------------------------------------------
  # XRouter stations — alternative packet-radio router by G8PZT.
  # Two of them, on the Aberdeen and Cambridge town channels, so each
  # one rubs shoulders with a different set of BPQ stations and they
  # cross-route through the synthetic backbone. Both expose their
  # built-in Telnet server (port 23) on a host port — telnet in,
  # `C QD0HUB-2` from the XRouter prompt, lands in the BPQ chat.
  # ------------------------------------------------------------------
  QA0XRT:
    image: ghcr.io/packethacking/xrouter:latest
    container_name: QA0XRT
    restart: unless-stopped
    depends_on:
      netsim: { condition: service_healthy }
    networks: [ rfnet ]
    volumes: [ "./xrouter/QA0XRT:/data" ]
    # 18019 telnet (XRouter port 23) · 18119 HTTP (80) · 18219 TELPROXY (2323)
    ports: [ "18019:23", "18119:80", "18219:2323" ]

  QC0XRT:
    image: ghcr.io/packethacking/xrouter:latest
    container_name: QC0XRT
    restart: unless-stopped
    depends_on:
      netsim: { condition: service_healthy }
    networks: [ rfnet ]
    volumes: [ "./xrouter/QC0XRT:/data" ]
    # 18020 telnet · 18120 HTTP · 18220 TELPROXY
    ports: [ "18020:23", "18120:80", "18220:2323" ]

  # ------------------------------------------------------------------
  # chatbot: four simulated users sustain a slow background chat on
  # CHT:QD0HUB-2. Pure RF presence — keeps the town channels and the
  # backbone showing some traffic on the live map. See chatbot/.
  # ------------------------------------------------------------------
  chatbot:
    image: python:3.12-alpine
    container_name: chatbot
    restart: unless-stopped
    depends_on:
      QD0HUB:    { condition: service_started }
      QA0ABN:    { condition: service_started }
      QC0CAS:    { condition: service_started }
      QD0DUR:    { condition: service_started }
      QE0EXS:    { condition: service_started }
    networks: [ rfnet ]
    volumes:
      - ./chatbot:/app:ro
    command: ["python3", "/app/chatbot.py"]

networks:
  rfnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
