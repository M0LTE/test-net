 TCPPORT=8003
 SPEED=1200
 CHANNEL=A
 QUALITY=192
 MAXFRAME=4
 PACLEN=120
 FRACK=3000
 RESPTIME=1000
 RETRIES=10
 INTERLOCK=0
 MHEARD=Y
ENDPORT
