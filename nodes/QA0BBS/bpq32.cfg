; QA0BBS-7 (ABEBBS) — Aberdeen BBS node. Single-port, runs BPQ Mail.
; Container CMD must be: mail
; BBS is reachable as QA0BBS-1 / alias BBS.

SIMPLE=1
NODECALL=QA0BBS-7
NODEALIAS=ABEBBS
LOCATOR=IO87IM
IDINTERVAL=30
NODESINTERVAL=1
BTINTERVAL=0
MAXLINKS=64
MAXNODES=200
MAXROUTES=64
MAXCIRCUITS=64
MINQUAL=10
ENABLE_LINKED=N
HIDENODES=0
PACLEN=120
OBSINIT=6
OBSMIN=4
L3TIMETOLIVE=20
L4RETRIES=3
L4TIMEOUT=60
L4DELAY=10
L4WINDOW=4
AUTOSAVE=1
NODE=1
BBS=1

APPLICATIONS=BBS
BBSCALL=QA0BBS-1
BBSALIAS=BBS
APPL1CALL=QA0BBS-1
APPL1ALIAS=BBS
APPL1QUAL=200

CTEXT:
QA0BBS-7 (ABEBBS) Aberdeen BBS. Connect BBS for mail.
***

PORT
 ID=Telnet/HTTP
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 MAXSESSIONS=10
 LOGGING=1
 USER=admin,changeme,QA0BBS,,SYSOP
ENDPORT

PORT
 ID=Aberdeen 2m
 TYPE=ASYNC
 PROTOCOL=KISS
