; QAGATE-7 (GATE) — Aberdeen-side gateway to the operator's real packet
; node. Two RF ports:
;
;   Port 2 (Aberdeen 2m, kiss 8031): standard NETROM-enabled.
;       Hears synthetic Aberdeen stations and the rest of the
;       synthetic mesh transitively. Participates fully in NETROM.
;
;   Port 3 (External user channel, kiss 8032): QUALITY=0.
;       BPQ does NOT broadcast NODES on this port and does NOT form
;       NETROM links over it. So a real packet node attached via the
;       host-published KISS port 8100 (the USEREXT samoyed on the
;       same private channel) does not learn the synthetic nodes
;       table — it only sees QAGATE-7 at the AX.25 layer when it
;       tries to connect directly.
;
; To use: from your real node, `C QAGATE-7`. CTEXT below lists the
; reachable synthetic nodes; from QAGATE's prompt, `C QA0HUB-7` etc.

SIMPLE=1
NODECALL=QAGATE-7
NODEALIAS=GATE
LOCATOR=IO87IM
PASSWORD=letmein
IDINTERVAL=0
NODESINTERVAL=1
BTINTERVAL=0
MAXLINKS=64
MAXNODES=200
MAXROUTES=64
MAXCIRCUITS=64
MINQUAL=10
ENABLE_LINKED=N
HIDENODES=0
PACLEN=120
OBSINIT=12
OBSMIN=2
L3TIMETOLIVE=20
L4RETRIES=3
L4TIMEOUT=60
L4DELAY=10
L4WINDOW=4
AUTOSAVE=1
NODE=1
BBS=0

CTEXT:
QAGATE-7 — gateway into the synthetic packet test net.
This port has NETROM disabled, so you won't see the synthetic
nodes in your NODES table. Connect manually from here:

  C QA0HUB-7   Aberdeen hub  (BBS at QA0HUB-1, alias BBS)
  C QB0HUB-7   Bristol hub   (BBS at QB0HUB-1, alias BBS)
  C QC0HUB-7   Cambridge hub
  C QD0HUB-7   Durham hub    (chat at QD0HUB-2, alias CHT)
  C QE0HUB-7   Exeter hub    (BBS at QE0HUB-1, alias BBS)

  C QA0XRT-1   Aberdeen XRouter
  C QC0XRT-1   Cambridge XRouter
***

PORT
 ID=Telnet/HTTP/FBB
 DRIVER=Telnet
 CONFIG
 TCPPORT=8010
 HTTPPORT=8008
 FBBPORT=8011
 LOGINPROMPT=user:
 PASSWORDPROMPT=password:
 MAXSESSIONS=10
 LOGGING=1
 CTEXT=Welcome to QAGATE-7 (GATE) gateway node\nEnter ? for help\n\n
 USER=admin,admin,QAGATE,,SYSOP
 USER=user,pass,QAGATE,,SYSOP
ENDPORT

PORT
 ID=Aberdeen 2m
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=172.28.0.10
 TCPPORT=8031
 SPEED=1200
 CHANNEL=A
 QUALITY=192
 MAXFRAME=4
 PACLEN=120
 FRACK=3000
 RESPTIME=1000
 RETRIES=10
 INTERLOCK=0
 MHEARD=Y
ENDPORT

PORT
 ID=Ext NoNETROM
 TYPE=ASYNC
 PROTOCOL=KISS
 IPADDR=172.28.0.10
 TCPPORT=8032
 SPEED=1200
 CHANNEL=A
 ; QUALITY=0 disables NETROM on this port: no NODES broadcasts go out,
 ; no NETROM peering is accepted. Direct AX.25 L2 still works.
 QUALITY=0
 MAXFRAME=4
 PACLEN=120
 FRACK=3000
 RESPTIME=1000
 RETRIES=10
 INTERLOCK=0
 MHEARD=Y
ENDPORT
